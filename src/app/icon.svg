<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- likelylist mark: the pixel-block motif from the site, on the same near-black.
       Drawn on an 8x8 grid of 4px cells so it stays legible at 16px. -->
  <rect width="32" height="32" fill="#0a0a0a"/>
  <g fill="#e4ff3f">
    <rect x="4"  y="4"  width="4" height="4"/>
    <rect x="4"  y="8"  width="4" height="4"/>
    <rect x="4"  y="12" width="4" height="4"/>
    <rect x="4"  y="16" width="4" height="4"/>
    <rect x="4"  y="20" width="4" height="4"/>
    <rect x="8"  y="20" width="4" height="4"/>
    <rect x="12" y="20" width="4" height="4"/>
    <rect x="20" y="4"  width="4" height="4"/>
    <rect x="24" y="8"  width="4" height="4"/>
    <rect x="20" y="12" width="4" height="4"/>
    <rect x="24" y="16" width="4" height="4"/>
  </g>
  <g fill="#ff4d6d">
    <rect x="24" y="4" width="4" height="4"/>
    <rect x="20" y="16" width="4" height="4"/>
  </g>
  <g fill="#4dd8ff">
    <rect x="20" y="8"  width="4" height="4"/>
    <rect x="24" y="12" width="4" height="4"/>
    <rect x="24" y="20" width="4" height="4"/>
  </g>
</svg>
